name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/test.sh
      - name: Build DMG
        run: BUILD_ARCH=universal SKIP_NOTARIZE=1 ./build.sh --dmg
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/CodexStatusBar.dmg
          generate_release_notes: true
