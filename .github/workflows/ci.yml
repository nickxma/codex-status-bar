name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/test.sh
      - name: Type-check
        run: swiftc -typecheck Sources/*.swift -framework Cocoa -framework ServiceManagement
      - name: Build
        run: ./build.sh
